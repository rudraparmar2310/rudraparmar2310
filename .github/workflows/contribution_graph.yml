name: Update Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate contribution graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: rudraparmar2310
          options: >-
            theme=github-compact&
            bg_color=0B1220&
            color=94A3B8&
            title_color=22D3EE&
            line=4ADE80&
            point=E2E8F0&
            area_color=22D3EE&
            area=true&
            hide_border=true&
            radius=8&
            custom_title=Rudra%20Parmar%27s%20Contribution%20Graph
          output_path: dist/contribution-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
