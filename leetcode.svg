<svg width="600" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="600" height="180" fill="#0B1220" rx="16"/>

  <!-- 100 Days Badge -->
  <g transform="translate(30,30)">
    <rect width="160" height="120" rx="14" fill="#15243D" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="80" cy="52" r="34" fill="none" stroke="url(#cyanGrad)" stroke-width="6"/>
    <text x="80" y="60" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#E2E8F0" text-anchor="middle">100</text>
    <text x="80" y="102" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">DAYS BADGE</text>
  </g>

  <!-- 50 Days Badge -->
  <g transform="translate(220,30)">
    <rect width="160" height="120" rx="14" fill="#15243D" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="80" cy="52" r="34" fill="none" stroke="url(#greenGrad)" stroke-width="6"/>
    <text x="80" y="60" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#E2E8F0" text-anchor="middle">50</text>
    <text x="80" y="102" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">DAYS BADGE</text>
  </g>

  <!-- SQL Badge -->
  <g transform="translate(410,30)">
    <rect width="160" height="120" rx="14" fill="#15243D" stroke="#60A5FA" stroke-width="2"/>
    <path d="M80 20 L110 42 L110 78 L80 100 L50 78 L50 42 Z" fill="none" stroke="url(#blueGrad)" stroke-width="4"/>
    <text x="80" y="58" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#E2E8F0" text-anchor="middle">SQL</text>
    <text x="80" y="102" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">50 BADGE</text>
  </g>
</svg>
