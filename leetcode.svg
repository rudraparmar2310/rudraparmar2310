#!/usr/bin/env python3
"""
enhance_leetcode_badges.py

Adds an extremely subtle radial glow + slow floating SMIL animation behind each
badge in a LeetCode badge SVG, WITHOUT touching the embedded badge image data.

The original <image .../> elements (including their base64 hrefs) are copied
byte-for-byte; they are only wrapped in a <g> that also holds the glow ellipse.

Usage:
    python3 enhance_leetcode_badges.py badges.svg badges_animated.svg
"""

import re
import sys

# One entry per badge, in document order. Extra badges reuse the last entry.
STYLES = [
    # colour,   base op, low, high, float distance (px), duration (s), delay (s)
    ("#4d7cff", 0.55, 0.42, 0.68, -2.0, 7.0, 0.0),   # blue  – 100 Days
    ("#7fd13b", 0.50, 0.38, 0.62,  2.0, 8.0, 0.6),   # green – 50 Days (opposite phase)
    ("#25c2f2", 0.52, 0.40, 0.66, -1.5, 6.5, 1.2),   # cyan  – SQL
]

SPLINE = 'calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"'


def num(tag, name, default=0.0):
    m = re.search(r'\b%s\s*=\s*"([^"]+)"' % name, tag)
    return float(m.group(1)) if m else default


def build(tag, idx, style):
    colour, op, lo, hi, dist, dur, delay = style
    x, y = num(tag, "x"), num(tag, "y")
    w, h = num(tag, "width", 170.0), num(tag, "height", 170.0)
    cx, cy = x + w / 2.0, y + h / 2.0
    rx, ry = w * 0.62, h * 0.58
    gid = "lcGlow%d" % idx

    grad = (
        '  <radialGradient id="{gid}" cx="50%" cy="50%" r="50%">\n'
        '    <stop offset="0%" stop-color="{c}" stop-opacity="0.30"/>\n'
        '    <stop offset="45%" stop-color="{c}" stop-opacity="0.11"/>\n'
        '    <stop offset="75%" stop-color="{c}" stop-opacity="0.035"/>\n'
        '    <stop offset="100%" stop-color="{c}" stop-opacity="0"/>\n'
        '  </radialGradient>\n'
    ).replace("{gid}", gid).replace("{c}", colour)

    group = (
        '<g>\n'
        '  <animateTransform attributeName="transform" attributeType="XML" type="translate"\n'
        '    values="0 0; 0 {d}; 0 0" dur="{dur}s" begin="{b}s" repeatCount="indefinite" {sp}/>\n'
        '  <ellipse cx="{cx}" cy="{cy}" rx="{rx}" ry="{ry}" fill="url(#{gid})" opacity="{op}">\n'
        '    <animate attributeName="opacity" values="{lo};{hi};{lo}" dur="{gdur}s" '
        'begin="{b}s" repeatCount="indefinite" {sp}/>\n'
        '  </ellipse>\n'
        '  {img}\n'
        '</g>'
    ).format(d=dist, dur=dur, gdur=round(dur * 1.35, 1), b=delay, sp=SPLINE, cx=cx, cy=cy,
             rx=rx, ry=ry, gid=gid, op=op, lo=lo, hi=hi, img=tag)
    return grad, group


def enhance(svg: str) -> str:
    tags = re.findall(r'<image\b[^>]*?/>', svg)
    if not tags:
        raise SystemExit("No <image> elements found in the SVG.")

    grads = []
    for i, tag in enumerate(tags, start=1):
        style = STYLES[min(i - 1, len(STYLES) - 1)]
        grad, group = build(tag, i, style)
        grads.append(grad)
        svg = svg.replace(tag, group, 1)

    defs = "<defs>\n" + "".join(grads) + "</defs>\n"
    m = re.search(r'<svg\b[^>]*>', svg)
    return svg[:m.end()] + "\n" + defs + svg[m.end():]


if __name__ == "__main__":
    if len(sys.argv) != 3:
        raise SystemExit(__doc__)
    src = open(sys.argv[1], "r", encoding="utf-8").read()
    open(sys.argv[2], "w", encoding="utf-8").write(enhance(src))
    print("wrote", sys.argv[2])
